<!doctype html>
<html><head><meta charset="utf-8"><title>selftest</title></head>
<body><pre id="out">running</pre>
<script src="js/data.js"></script>
<script src="js/analytics.js"></script>
<script src="js/ollama.js"></script>
<script>
(async () => {
  const out = [];
  const log = (k, v) => { out.push({ k, v }); document.getElementById('out').textContent = JSON.stringify(out, null, 1); };
  try {
    log('models', await Ollama.listModels());
    Ollama.save({ model: 'qwen2.5:7b' });
    for (const id of ['FE', 'INC']) {
      const t = performance.now();
      const res = await Ollama.runAgent(Ollama.AGENTS.find(a => a.id === id));
      log(id + ' secs', Math.round((performance.now() - t) / 1000));
      log(id, res);
    }
    const t = performance.now();
    const story = await Ollama.stream([{ role: 'system', content: Ollama.SYSTEM }, { role: 'user', content: 'Write a 120-word board summary in markdown with a "# " title, using only this data: ' + JSON.stringify(Analytics.contextFor('all')) }], () => {});
    log('story secs', Math.round((performance.now() - t) / 1000));
    log('story', story);
  } catch (e) { log('ERROR', String(e)); }
  log('DONE', true);
})();
</script></body></html>
