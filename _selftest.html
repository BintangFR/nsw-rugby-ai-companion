<!doctype html>
<html><head><meta charset="utf-8"><title>selftest</title></head>
<body><pre id="out">running</pre>
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/analytics.js"></script>
<script src="js/ollama.js"></script>
<script>
(async () => {
  const out = [];
  const log = (k, v) => { out.push({ k, v }); document.getElementById('out').textContent = JSON.stringify(out, null, 1); };
  try {
    log('store mode', await Store.init());
    Ollama.save({ model: 'qwen2.5:7b' }); log('config', Ollama.config);
    for (const a of Ollama.AGENTS) log('ctx chars ' + a.id, JSON.stringify(Analytics.contextFor(a.id)).length);
    for (const a of Ollama.AGENTS) {
      const t = performance.now();
      try { const r = await Ollama.runAgent(a); log(a.id + ' OK', r.length + ' insights'); }
      catch (e) { log(a.id + ' FAILED', String(e && e.stack || e)); }
    }
  } catch (e) { log('ERROR', String(e)); }
  log('DONE', true);
})();
</script></body></html>
